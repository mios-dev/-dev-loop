[command]
name = "backlog"
description = "Work the task ledger that carries a repo between sessions: what is unblocked now, add a task with its acceptance check and both controls, flip status with cited evidence, validate, render, emit a lane"
version = "1.0.0"
entrypoint = "python3 scripts/artifacts.py tasks"

[parameters]
mode = { type = "string", description = "Ledger operation", default = "next", enum = ["next", "add", "set", "validate", "render", "lane"] }
id = { type = "string", description = "Task id, positional for set/lane and --id for add; must match ^[A-Z]+-[0-9]+$", required = false }
status = { type = "string", description = "New status, positional for set", required = false, enum = ["open", "in_progress", "blocked", "done", "cancelled"] }
root = { type = "string", description = "Repository root holding .devloop/tasks.jsonl", default = "." }
evidence = { type = "string", description = "Verification evidence for `set <id> done`; both controls, exact commands", required = false }

[state]
store = ".devloop/tasks.jsonl"
format = "one JSON object per line"
rendered_view = "TASKS.md"
rule = "TASKS.md is generated; hand-editing it loses the edit on the next render. Edit the JSONL through add/set, then render."

[modes]
next = "ids that are open, not epics, with every depends_on already done or cancelled - the first command of a fresh session, after the last .devloop/LEDGER.md entry"
add = "create a task with its definition of done attached"
set = "flip a status, with evidence when the status is done"
validate = "ids unique and well-shaped, status/type vocabulary, depends_on and epic resolvable, no cycles, done implies evidence"
render = "validate, then regenerate TASKS.md grouped by epic with checkboxes, owners, dependency arrows and an N/M done footer"
lane = "print a v2 lane object on stdout, ready for the verification gate or a lanes.json"

[add_flags]
required = ["--id", "--title"]
acceptance = "--ac (REPEATABLE, once per criterion, EARS form: WHEN <trigger> THE SYSTEM SHALL <observable behaviour>)"
controls = ["--positive <check that must pass>", "--negative <plant the defect, run the same check, restore the tree, exit non-zero>", "--expect <regex the negative output must match>"]
optional = ["--type task|epic|bug", "--owner", "--epic", "--goal", "--depends a,b"]
refused_by_tool = ["duplicate id", "unknown --depends id", "unknown --epic id", "id not matching ^[A-Z]+-[0-9]+$"]
not_refused_by_tool = "a task with no --ac and no controls is ACCEPTED by the tool - refuse it yourself; it can never be proven done, and `tasks lane` will return the literal <fill>"

[set_rules]
vocabulary = ["open", "in_progress", "blocked", "done", "cancelled"]
done_requires_evidence = true
note = "`set <id> done` without --evidence exits 1 unless the task already carries verification_evidence. That refusal is the feature - never route around it by hand-editing the JSONL."
evidence_shape = "the exact positive command and its result, AND the exact negative command with the line showing it failing for the planted reason. 'Tests pass' is not evidence."

[two_sided_verification]
principle = "A check that cannot fail passes identically on correct and on broken code, so every task carries both controls."
positive = "the check that must pass once the work is correct"
negative = "plant the defect, run the same check, it must FAIL naming the plant, then restore the tree"
plant_naming_prefer = "organic - mutate real code and match the tool's own error"
plant_naming_fallback = "DEVLOOP-PLANTED-<LANE_ID>, one unique sentinel per task"
plant_naming_forbidden = "a sentinel shared between tasks, or an expect string that also appears in the fixture's own filename"

[lane_output]
stream = "stdout"
no_out_flag = true
fields = ["id", "task_id", "objective", "owned_paths", "positive_cmd", "negative_control_cmd", "negative_expect", "depends_on"]
owned_paths = "always returned as [\"<fill: exclusive globs>\"] - you fill in the exclusive globs this lane may write"
fill_means_stop = "a control field returned as the literal <fill> means the task defines no control: STOP and ask. Never invent a negative control nobody defined."
consumers = ["the /verify gate for one task", "a lanes.json for /dev-loop"]

[boundaries]
not_goal = "/goal owns the objective, its stopping conditions and the eval loop, and decomposes a goal into tasks at definition time; /backlog is the day-to-day ledger afterwards"
merge_path = "the dev loop already flips a task's status on a successful merge; /backlog covers everything outside that path"
no_git = "/backlog never runs git add, git commit or git push; it writes .devloop/tasks.jsonl and TASKS.md only"

[exit_codes]
0 = "the operation succeeded; for validate, 'tasks.jsonl ok: N tasks'"
1 = "refused - unknown task, status outside the vocabulary, done without evidence, duplicate id, or an invalid ledger that render will not emit"
