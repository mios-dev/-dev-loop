description = "Report the state of a dev-loop run from its run directory (read-only): per-lane reports, shell-written exit receipts, job liveness"
prompt = """
Load the `watch` skill (SKILL.md in .gemini/skills/watch/, .agents/skills/watch/, or ~/.gemini/skills/watch/) and report the state of this run directory:

{{args}}

Empty argument means the newest `.devloop/run-*`. This command is READ-ONLY: never dispatch a lane, never merge, never kill a job.

1. Enumerate lane ids from `lane-<id>.json` in the run dir.
2. Per lane, report three sources side by side: `report-<id>.json` `.status` (the MODEL's claim: done|partial|blocked|converged_stuck|budget|halted), `worker-<id>.exit` (the SHELL's receipt that devloop.sh appends as `; echo $? > worker-<id>.exit` — 0 clean, 124 timeout, 125 never started, absent = nothing returned) and the tail of `worker-<id>.log`. NEVER call a lane done from the report when the receipt is absent or non-zero: completion is an artefact the shell writes, never a sentence the model says.
3. Job liveness: `python3 <skills dir>/dev-loop/scripts/job.py status --root <RUN>/jobs --json`. Use its vocabulary literally: absent | running | done | lost | forged (exit 2 = failed/not done, 3 = lost/forged). Call out `lost` — SIGKILLed wrapper, no receipt, possibly live grandchildren; kill goes by session id, not process group.
4. Bounded waiting only, and only if asked: `job.py wait --root <RUN>/jobs --id ID --budget N --interval N`. Never an unbounded poll; an exhausted budget is PARTIAL, never done.
5. ANTIGRAVITY-HOSTED RUNS ONLY: if an NDJSON stream written by `agy_session.py --events-out` exists (.devloop/native/session-events.ndjson, or $AGY_HOST_EVENTS), run `python3 <skills dir>/dev-loop/scripts/agy_monitor.py <stream> --once` and honour exit 2 (verdicts vacuous / no_result / stalled; it also exits 2 with verdict no_stream when the file is absent, so read the printed verdict, not the code alone). Lanes under other harnesses write no such stream and have no step-level view — say so rather than implying one.
6. Output one line per lane (id, model status, receipt, job state, age), then the anomalies: `done` claims without a clean receipt, lost/forged jobs, lanes with no report, stalls. Cite `pos-<id>.log` and `neg-<id>.log` together — a negative control that never ran, or that passed, means unverified, not done.

Newest run: !{ls -1d .devloop/run-* 2>/dev/null | tail -1}
Run artefacts: !{ls -1 $(ls -1d .devloop/run-* 2>/dev/null | tail -1) 2>/dev/null | head -40}
"""
