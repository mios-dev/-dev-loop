[command]
name = "gate-audit"
description = "Audit standing gates against the 'Checks That Cannot Fail' taxonomy, then plant the violation each cleared gate claims to catch and require it to go red"
version = "2.0.0"
entrypoint = "python3 scripts/gate_audit.py"

[parameters]
target = { type = "string", description = "CI workflow, gate/lint script, Makefile/justfile, or test directory to audit", required = true }
recipe = { type = "string", description = "Makefile/justfile recipe name (--target); only that recipe's body is scanned", required = false }
only = { type = "string", description = "Comma-separated rule ids to run; default all seven", required = false }
json = { type = "boolean", description = "Machine-readable report on stdout", default = false }
list_rules = { type = "boolean", description = "Print what is detected and what is left to agent judgment, then exit 0", default = false }

[protocols]
audits_standing_machinery = true
two_sided_verification = true
plant_and_prove_every_cleared_gate = true
blast_radius_before_arming = true

[exit_codes]
0 = "no pattern matched - NOT a proof that the gate can fail; the plant-and-prove step is still owed"
1 = "vacuous gate(s) found, each with its section 7 row, line, reason and remediation"
2 = "NOTHING AUDITED - target unreadable, unsupported, no scannable file, or no such recipe; never report as clean"

[detected]
SKIP_AS_PASS = "a tool/file probe whose miss path reaches exit 0 / return 0, same line after || (or &&/then when negated) or inside the branch it opens, including its else"
SWALLOWED_FAILURE = "|| true, || :, || exit 0, trailing ; true, set +e, --exit-zero, continue-on-error: true, except: pass, empty .catch(() => {}), '-'-prefixed make recipe line, missing set -e / pipefail / $ErrorActionPreference='Stop'"
UNANCHORED_ALLOWLIST = "an allow/ignore/exempt/skip identifier matched loosely (grep, re.search, .includes, .startswith, any(x in y), fnmatch, Select-String) with no ^...$ anchor and no exact compare"
COUNT_ONLY_RATCHET = "a numeric threshold compared against a count-ish subject (count, len(, wc -l, threshold, baseline, limit, violations); comparisons against 0 are skipped"
TIMEOUT_AS_PASS = "a timeout whose failure is swallowed, a TimeoutExpired handler that neither raises nor fails, or a file running 'timeout N' that never inspects an exit status or the 124 kill code"
CHECK_WITHOUT_DIFF = "a --check/--verify/dry_run branch whose body contains no comparison at all - no diff, cmp, hash, ==/!=/-eq, assert, or check/verify/compare/diff call"
SELF_COMPARISON = "a diff/cmp/filecmp/Compare-Object operand regenerated by a generator within the preceding 10 lines, into the tree rather than a temp location"

[agent_judgment]
note = "Six taxonomy rows need a reader. gate_audit.py does not detect them and must not be described as doing so; the agent works each against the SKILL.md section 7 row text."
rows = ["Measuring the Wrong Property", "Self-Certifying Predicate", "Empty-Set Pass", "Mock-Only Coverage", "Assertion-Free Test", "Snapshot Rubber-Stamp"]

[plant_and_prove]
rule = "For every gate the audit CLEARS: plant the violation that gate claims to catch and require the gate to go red, naming the plant. A gate that stays green is vacuous regardless of how it reads."
restore = "Restore the tree (git status --porcelain empty). Never git add or commit a plant."
naming = "Prefer the tool's own error on a real mutation; otherwise DEVLOOP-PLANTED-<TARGET-ID>, never a string that also appears in the fixture's filename or the gate's own prompt"

[not_review]
difference = "/review audits a DIFF (contract preservation, security, suppression drift, escalation tiers). /gate-audit audits the STANDING gate machinery whether or not it changed."

[references]
taxonomy = "skills/dev-loop/SKILL.md section 7"
coverage_map = "skills/dev-loop/references/gate-audit.md"
